[GateServer]
host=localhost
port=8080

[Delivery]
RequestRetryInitialMs=2000
RequestRetryMaxMs=30000

[Resource]
; TransferEngine 窗口/超时/退避（P1b-02；缺省即引擎默认值）
MaxActiveUploads=2
MaxActiveDownloads=4
MaxInflightChunks=4
AckTimeoutMs=30000
BackoffInitialMs=1000
BackoffMaxMs=30000
ChunkSizeKB=32
TickIntervalMs=250
; 传输层（FileTcpMgr）
ReconnectInitialMs=1000
ReconnectMaxMs=30000
SendHighWatermarkBytes=4194304
