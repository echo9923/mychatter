[GateServer]
host=localhost
port=8080

[Delivery]
RequestRetryInitialMs=2000
RequestRetryMaxMs=30000

[Resource]
; TransferEngine 窗口/超时/退避（P1b-02）。P1c 起分片为 256KiB 二进制帧，
; 分片单位固定（proto/resource_wire.h 唯一真值），旧 ChunkSizeKB 键已忽略。
MaxActiveUploads=2
MaxActiveDownloads=4
MaxInflightChunks=4
AckTimeoutMs=30000
BackoffInitialMs=1000
BackoffMaxMs=30000
TickIntervalMs=250
; 传输层（FileTcpMgr）
ReconnectInitialMs=1000
ReconnectMaxMs=30000
SendHighWatermarkBytes=4194304
