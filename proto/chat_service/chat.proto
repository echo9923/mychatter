syntax = "proto3";

package message;

// ChatServer 实现，StatusServer / ResourceServer / 其他ChatServer实例 作为客户端调用
service ChatService {
  rpc NotifyAddFriend (AddFriendReq) returns (AddFriendRsp) {}
  rpc NotifyAuthFriend (AuthFriendReq) returns (AuthFriendRsp) {}
  rpc NotifyTextChatMsg (TextChatMsgReq) returns (TextChatMsgRsp) {}
  rpc NotifyKickUser (KickUserReq) returns (KickUserRsp) {}
  rpc NotifyChatResourceMsg (NotifyResourceReq) returns (NotifyResourceRsp) {}
}

// ========== 好友申请 ==========
message AddFriendReq {
  int64 applyuid = 1;
  string name = 2;
  string desc = 3;
  string icon = 4;
  string nick = 5;
  int32 sex = 6;
  int64 touid = 7;
}

message AddFriendRsp {
  int32 error = 1;
  int64 applyuid = 2;
  int64 touid = 3;
}

// ========== 好友认证 ==========
message AddFriendMsg {
  int64 sender_id = 1;
  string unique_id = 2;
  int64 msg_id = 3;
  int64 thread_id = 4;
  string msgcontent = 5;
  int32 status = 6;
}

message AuthFriendReq {
  int64 fromuid = 1;
  int64 touid = 2;
  repeated AddFriendMsg textmsgs = 3;
}

message AuthFriendRsp {
  int32 error = 1;
  int64 fromuid = 2;
  int64 touid = 3;
}

// ========== 文本聊天 ==========
message TextChatData {
  string unique_id = 1;
  int64 msg_id = 2;
  string msgcontent = 3;
  string chat_time = 4;
}

//单条化：一次跨服投递固定携带一条文本消息（text_array 批量设计已删除）
message TextChatMsgReq {
  int64 fromuid = 1;
  int64 touid = 2;
  int64 thread_id = 3;
  TextChatData textmsg = 4;
}

message TextChatMsgRsp {
  int32 error = 1;
  int64 fromuid = 2;
  int64 touid = 3;
  int64 thread_id = 4;
  reserved 5; //原 repeated TextChatData textmsgs，单条化后无人消费，删除
}

// ========== 踢人 ==========
message KickUserReq {
  int64 uid = 1;
}

message KickUserRsp {
  int32 error = 1;
  int64 uid = 2;
}

// ========== 资源消息通知（图片/文件统一） ==========
// 触发点：ResourceServer 收齐分片并置 resource_status=Ready 后调用。
// 只传定位字段：ChatServer 按 message_id 回读 DB 组统一 envelope（含
// resource_status/content_hash/mime_type/msg_type），避免展示字段在
// gRPC 层与 DB 真值分叉。
message NotifyResourceReq {
  int64 from_uid = 1;
  int64 to_uid = 2;
  int64 message_id = 3;
  int64 thread_id = 4;
}

message NotifyResourceRsp {
  int32 error = 1;
  int64 from_uid = 2;
  int64 to_uid = 3;
  int64 message_id = 4;
  int64 thread_id = 5;
}
