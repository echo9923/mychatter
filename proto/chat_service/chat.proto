syntax = "proto3";

package message;

// Implemented by ChatServer; peer ChatServers and ResourceServer call it.
service ChatService {
  rpc NotifyUserMessage (NotifyUserMessageReq) returns (NotifyUserMessageRsp) {}
  rpc NotifyKickUser (KickUserReq) returns (KickUserRsp) {}
}

// The target ChatServer reads the canonical row before emitting TCP 1701.
message NotifyUserMessageReq {
  int64 to_uid = 1;
  int64 message_id = 2;
  int32 event_type = 3;
  int64 friend_request_id = 4;
}

message NotifyUserMessageRsp {
  int32 error = 1;
  int64 message_id = 2;
  int64 friend_request_id = 3;
}

message KickUserReq {
  int64 uid = 1;
}

message KickUserRsp {
  int32 error = 1;
  int64 uid = 2;
}
