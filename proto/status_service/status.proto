syntax = "proto3";

package message;

// StatusServer 实现，GateServer 作为客户端调用（mTLS）
service StatusService {
  rpc GetChatServer (GetChatServerReq) returns (GetChatServerRsp) {}
  rpc Login (LoginReq) returns (LoginRsp) {}
}

// 票据意图：INITIAL = 密码验证后的首次登录；RESUME = 持有效 session token 的恢复登录
enum TicketIntent {
  INITIAL = 0;
  RESUME = 1;
}

message GetChatServerReq {
  int32 uid = 1;
  TicketIntent intent = 2;
  // 仅 RESUME：客户端所持 session token 的 SHA-256（hex），随票据下发给 ChatServer 比对
  string session_token_sha256 = 3;
}

message GetChatServerRsp {
  int32 error = 1;
  string server_name = 2;
  string host = 3;
  string port = 4;
  // 一次性 chat 票据（60s TTL，ChatServer 原子消费）
  string chat_ticket = 5;
}

message LoginReq {
  int32 uid = 1;
  string token = 2;
}

message LoginRsp {
  int32 error = 1;
  int32 uid = 2;
  string token = 3;
}
