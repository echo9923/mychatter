syntax = "proto3";

package message;

// StatusServer 实现，GateServer 作为客户端调用（普通 gRPC，无 mTLS）
service StatusService {
  rpc GetChatServer (GetChatServerReq) returns (GetChatServerRsp) {}
}

message GetChatServerReq {
  int32 uid = 1;
  string token = 2;
}

message GetChatServerRsp {
  int32 error = 1;
  string server_name = 2;
  string host = 3;
  string port = 4;
  // 登录令牌：Status 写入 Redis utoken_<uid>（TTL 86400s），客户端原样带给 Chat/Resource 校验
  string token = 5;
}
