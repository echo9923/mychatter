syntax = "proto3";

package message;

// StatusServer 实现，GateServer / ChatServer 作为客户端调用
service StatusService {
  rpc GetChatServer (GetChatServerReq) returns (GetChatServerRsp) {}
  rpc Login (LoginReq) returns (LoginRsp) {}
}

message GetChatServerReq {
  int32 uid = 1;
}

message GetChatServerRsp {
  int32 error = 1;
  string host = 2;
  string port = 3;
  string token = 4;
}

message LoginReq {
  int32 uid = 1;
  string token = 2;
}

message LoginRsp {
  int32 error = 1;
  int32 uid = 2;
  string token = 3;
}
