[SelfServer]
Name = reserver
Host = 0.0.0.0
Port = 9090
[Mysql]
Host = 127.0.0.1
Port = 3308
User = root
Passwd = 123456.
Schema = llfc
;连接池大小（默认 12）
PoolSize = 12
[Redis]
Host = 127.0.0.1
Port = 6380
Passwd = 123456
[Output]
Path = bin
[Storage]
;资源消息存储根目录（P2 内容寻址 CAS：uploading/<mid>.part、blobs/<sha[0:2]>/<sha256>）。
;绝对路径原样使用；相对路径相对进程工作目录解析。缺省 <Output.Path>/resource。
;注意：CAS 根目录只能由一个 ResourceServer 进程独占（进程内 std::mutex 不跨进程）。
ResourceRoot = bin/resource
[Static]
Path = static
[Delivery]
RpcDeadlineMs = 3000
RpcMaxAttempts = 3
RpcBackoffMs = 100
